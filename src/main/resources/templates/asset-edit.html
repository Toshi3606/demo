<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>資産編集</title>
  </head>
  <body>
    <h2>資産編集画面</h2>

    <form th:action="@{/assets/edit/{id}(id=${asset.assetId})}" method="post">
      <p>
        ID :
        <span th:text="${asset.assetId}"></span>
      </p>

      <p>
        資産名
        <input type="text" name="assetName" th:value="${asset.assetName}" />
      </p>

      <p>
        種別
        <input type="text" name="assetType" th:value="${asset.assetType}" />
      </p>

      <p>
        金額
        <input type="number" name="amount" th:value="${asset.amount}" />
      </p>

      <p>
        満期日
        <input
          type="date"
          name="maturityDate"
          th:value="${asset.maturityDate}"
        />
      </p>

      <p>
        金利
        <input
          type="number"
          step="0.01"
          name="interestRate"
          th:value="${asset.interestRate}"
        />
      </p>

      <button type="submit">更新</button>

      <button type="button" onclick="location.href = '/assets'">戻る</button>
    </form>
  </body>
</html>
