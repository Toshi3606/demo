<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>資産編集</title>
  </head>
  <body>
    <h2>資産編集画面</h2>

    <form>
      <p>ID : <span th:text="${id}"></span></p>

      <p>
        資産名
        <input type="text" />
      </p>

      <p>
        種別
        <input type="text" />
      </p>

      <p>
        金額
        <input type="number" />
      </p>

      <p>
        満期日
        <input type="date" />
      </p>

      <p>
        金利
        <input type="number" step="0.01" />
      </p>

      <button type="submit">更新</button>

      <button type="button" onclick="location.href = '/assets-page'">
        戻る
      </button>
    </form>
  </body>
</html>
