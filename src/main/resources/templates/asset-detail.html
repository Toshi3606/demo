<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>資産詳細</title>
  </head>
  <body>
    <h1>資産詳細画面</h1>

    <p>
      資産ID :
      <span th:text="${asset.assetId}"></span>
    </p>

    <p>
      資産名 :
      <span th:text="${asset.assetName}"></span>
    </p>

    <p>
      種別 :
      <span th:text="${asset.assetType}"></span>
    </p>

    <p>
      金額 :
      <span th:text="${#numbers.formatInteger(asset.amount, 0, 'COMMA')}"></span
      >円
    </p>

    <p>
      満期日 :
      <span th:text="${asset.maturityDate}"></span>
    </p>

    <p>
      金利 :
      <span th:text="${asset.interestRate}"></span>%
    </p>

    <a th:href="@{/assets/edit/{id}(id=${asset.assetId})}"> 編集 </a>

    |

    <a th:href="@{/assets}"> 戻る </a>
  </body>
</html>
