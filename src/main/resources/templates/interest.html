<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>金利情報管理</title>
  </head>
  <body>
    <h1>金利情報管理画面</h1>

    <a th:href="@{/top}">トップへ戻る</a>

    <br /><br />

    <table border="1">
      <tr>
        <th>資産ID</th>
        <th>金利</th>
      </tr>

      <tr th:each="asset : ${assets}">
        <td th:text="${asset.assetId}"></td>
        <td th:text="${asset.interestRate + '%'}"></td>
      </tr>
    </table>

    <br /><br />

    <label>資産ID：</label>

    <select name="assetId">
      <option value="">選択してください</option>

      <option
        th:each="asset : ${assets}"
        th:value="${asset.assetId}"
        th:text="${asset.assetId}"
      ></option>
    </select>

    <br /><br />

    <label>金利：</label>

    <input type="number" step="0.01" name="interestRate" />

    <button type="button">登録</button>
  </body>
</html>
