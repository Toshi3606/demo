<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>資産一覧</title>
  </head>
  <body>
    <h1>資産一覧画面</h1>

    <p>
      <a th:href="@{/asset/new}"> 新規登録 </a>
    </p>

    <table border="1">
      <tr>
        <th>ID</th>
        <th>資産名</th>
        <th>種別</th>
        <th>金額</th>
        <th>詳細</th>
        <th>編集</th>
      </tr>

      <tr th:each="asset : ${assets}">
        <td th:text="${asset.assetId}"></td>

        <td th:text="${asset.assetName}"></td>

        <td th:text="${asset.assetType}"></td>

        <td
          th:text="${#numbers.formatDecimal(asset.amount,0,'COMMA',0,'POINT')} + ' 円'"
        ></td>

        <td>
          <a th:href="@{/asset/{id}(id=${asset.assetId})}"> 詳細 </a>
        </td>

        <td>
          <a th:href="@{/asset/edit/{id}(id=${asset.assetId})}"> 編集 </a>
        </td>

        <td>
          <form
            th:action="@{/asset/delete/{id}(id=${asset.assetId})}"
            method="post"
            onsubmit="return confirm('削除しますか？');"
          >
            <button type="submit">削除</button>
          </form>
        </td>
      </tr>
    </table>
  </body>
</html>
