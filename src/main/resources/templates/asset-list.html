<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>資産一覧</title>
  </head>
  <body>
    <h1>資産管理システム</h1>

    <h2>資産一覧画面</h2>

    <a th:href="@{/top}">トップへ戻る</a>

    <table border="1">
      <tr>
        <th>ID</th>
        <th>資産名</th>
        <th>種別</th>
        <th>金額</th>
        <th>操作</th>
      </tr>

      <tr th:each="asset : ${assets}">
        <td th:text="${asset.assetId}"></td>
        <td th:text="${asset.assetName}"></td>
        <td th:text="${asset.assetType}"></td>
        <td th:text="${#numbers.formatInteger(asset.amount, 0, 'COMMA')}"></td>

        <td>
          <a th:href="@{/assets/{id}(id=${asset.assetId})}"> 詳細 </a>
        </td>
      </tr>
    </table>
  </body>
</html>
